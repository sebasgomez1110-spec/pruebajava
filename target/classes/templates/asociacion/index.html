<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Asociacion')}"></head>

<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4">
    <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-info text-dark">
            <h4>Registrar Asociación</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/asociaciones/guardar}" th:object="${asociacion}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>País</label>
                        <input type="text" th:field="*{pais}" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Presidente</label>
                        <input type="text" th:field="*{presidente}" class="form-control" required>
                    </div>
                </div>

                <button class="btn btn-info">Guardar</button>
                <a href="/asociaciones/listar" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
