<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Lista Asociaciones')}"></head>

<body class="bg-light">

<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4">
    <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-info text-dark d-flex justify-content-between">
            <h4>Lista de Asociaciones</h4>
            <a href="/asociaciones/nuevo" class="btn btn-dark">+ Nueva</a>
        </div>

        <div class="card-body">
            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>País</th>
                    <th>Presidente</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="a : ${asociaciones}">
                    <td th:text="${a.id}"></td>
                    <td th:text="${a.nombre}"></td>
                    <td th:text="${a.pais}"></td>
                    <td th:text="${a.presidente}"></td>
                    <td>
                        <a th:href="@{/asociaciones/editar/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/asociaciones/eliminar/{id}(id=${a.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

</body>
</html>
